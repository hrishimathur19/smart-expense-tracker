<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Expenses</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f6f9;
            padding:30px;
        }

        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
            margin-bottom:30px;
        }

        header h1{
            color:#2563eb;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }

        h2{
            margin-bottom:20px;
            color:#333;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#2563eb;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f1f1f1;
        }

        .back-btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 20px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }

        .back-btn:hover{
            background:#1d4ed8;
        }
        .delete-btn{

    background:#ef4444;
    color:white;
    padding:8px 14px;
    border-radius:6px;
    text-decoration:none;
    font-size:14px;

}

.delete-btn:hover{

    background:#dc2626;

}

    </style>

</head>
<body>

<header>

    <h1>💰 Smart Expense Tracker</h1>

</header>

<div class="container">

    <h2>Expense History</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Description</th>
        </tr>

        {% for expense in expenses %}

        <tr>

            <td>{{ expense[0] }}</td>

            <td>{{ expense[1] }}</td>

            <td>₹{{ expense[2] }}</td>

            <td>{{ expense[3] }}</td>

            <td>{{ expense[4] }}</td>
            <td>

        <a href="/delete/{{ expense[0] }}" class="delete-btn">
            Delete
        </a>

    </td>

        </tr>

        {% endfor %}

    </table>

    <a href="/dashboard" class="back-btn">
        ← Back to Dashboard
    </a>


</div>

</body>
</html>
