<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
body{
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

.card{
    width: 400px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
    text-align: center;
}

.card h1{
    color: #2563eb;
    margin-bottom: 10px;
}

.card h3{
    color: #555;
    margin-bottom: 25px;
}

label{
    display: block;
    text-align: left;
    margin-bottom: 6px;
    font-weight: bold;
}

input{
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
}

input:focus{
    outline: none;
    border-color: #2563eb;
}

.forgot{
    text-align: center;
    margin-bottom: 14px;
}

button{
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover{
    background: #1d4ed8;
}

.register{
    margin-top: 20px;
    font-size: 15px;
}

a{
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

a:hover{
    text-decoration: underline;
}
.tagline{
    color: #666;
    font-size: 14px;
    margin-top: -5px;
    margin-bottom: 25px;
}   
    </style>
</head>
<body>

    <div class="card">
        <H1>💰 Smart Expense Tracker</H1>
        <p class="tagline">Track every rupee. Save every month.</p>
        <h3>Welcome Back</h3>
        <form action="/dashboard">
            <label>Username</label><br>
            <input type="text" placeholder="Enter Your Username: "><br><br>

            <label>Password</label><br>
            <input type="password" placeholder="Enter Your Password: "><br><br>

            <div class="forgot">
                <a href="#">Forgot Password</a>
            </div>

            <button type="submit">Login</button>
        </form>
        <p>
            Don't have an account?
             <a href="{{ url_for('register') }}">Register</a>
        </p>
    </div>
</body>
</html>
