<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Monthly Budget</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        header{
            background:#2563eb;
            color:white;
            padding:20px 40px;
            font-size:28px;
            font-weight:bold;
        }

        .container{
            width:420px;
            margin:60px auto;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            margin-bottom:20px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:14px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

        .back-btn:hover{
            text-decoration:underline;
        }

    </style>

</head>
<body>

<header>
    💰 Smart Expense Tracker
</header>

<div class="container">

    <h2>Set Monthly Budget</h2>

    <form method="POST">

        <label>Budget Amount (₹)</label>

        <input
            type="number"
            name="amount"
            placeholder="Enter your monthly budget"
            min="1"
            step="0.01"
            required
        >

        <button type="submit">
            Save Budget
        </button>

    </form>

    <a href="/dashboard" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
