<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>

<style>
*{
    box-sizing: border-box;
}

body{
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

.card{
    width: 400px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
    text-align: center;
}

.card h1{
    color: #2563eb;
    margin-bottom: 10px;
}

.card h3{
    color: #555;
    margin-bottom: 5px;
}

.tagline{
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
}

label{
    display: block;
    text-align: left;
    margin-bottom: 6px;
    font-weight: bold;
}

input{
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

input:focus{
    outline: none;
    border-color: #2563eb;
}

button{
    width: 100%;
    padding: 12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.register{
    margin-top:20px;
}

a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="card">

    <h1>💰 Smart Expense Tracker</h1>
    <h3>Create Account</h3>
    <p class="tagline">Track your expenses efficiently.</p>

    <form>

        <label>Name</label>
        <input type="text" placeholder="Enter Your Name">

        <label>Username</label>
        <input type="text" placeholder="Enter your Username">

        <label>Email</label>
        <input type="email" placeholder="Enter Your Email">

        <label>Password</label>
        <input type="password" placeholder="Enter your Password">

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm Your Password">

        <button type="submit">Register</button>

    </form>

    <p class="register">
        Already have an account?
         <a href="{{ url_for('home') }}">Login</a>
    </p>

</div>

</body>
</html>
